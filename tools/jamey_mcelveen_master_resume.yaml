  acs_tenure: "25 years"

# ── SUMMARIES ─────────────────────────────────────────────────────────────────
# Swap in the right variant per application. Keep the chosen one under ~4 lines.

summaries:
  full: >
    Principal Systems Architect with 30+ years of experience in Christian tech and fintech.
    Expert in architecting scalable solutions for platforms serving 50,000+ organizations.
    Proven engineering leader — managed R&D teams of 20+, delivered products from concept
    to 50k-org scale, and applies AI-assisted tooling (e.g. Cursor) selectively for modernization
    and delivery while keeping architectural ownership and quality bar high.

  short: >
    Principal Systems Architect · 30+ years · 50,000+ orgs served · 20+ engineers led ·
    Selective AI-assisted engineering in modernization work.

  christian_tech_focus: >
    Principal Systems Architect with 30+ years dedicated to Christian tech and ministry
    software. Architected Realm, ACS Technologies' flagship platform serving 50,000+
    churches, and pioneered ChurchLife — one of the first 100 apps on the Apple App Store.
    Deep domain expertise in faith-organization workflows, donor management, and community
    platforms at scale, combined with modern engineering: .NET Core, React, CI/CD, and
    selective AI-assisted development practices where they reduce rework without lowering standards.

  healthcare_focus: >
    Principal Systems Architect with 30+ years of experience, including healthcare IT
    modernization at McLeod Health. Skilled in migrating legacy C# systems to HIPAA-aware
    .NET Core standards, introducing CI/CD to clinical infrastructure, and mentoring
    engineering teams in regulated environments. Brings both deep architectural experience
    and a hands-on approach to healthcare systems where reliability and compliance are
    non-negotiable.

  fintech_focus: >
    Principal Systems Architect with 30+ years of experience, including high-performance
    payment and financial API work at SecureGive. Architected Snowflake + .NET Core API
    Gateways for transaction processing at scale. Expert in building auditable, secure
    financial systems with disciplined delivery in a regulated environment.

  saas_focus: >
    Principal Systems Architect with 30+ years building and operating multi-tenant SaaS
    platforms. Led engineering of a flagship SaaS product serving 50,000+ organizations
    across a 25-year tenure at ACS Technologies. Deep expertise in .NET Core, React,
    multi-tenant architecture, CI/CD, and AI-augmented development. Proven leader managing
    R&D teams of 20+ through multiple product generations.

  leadership_focus: >
    Engineering leader with 30+ years directing high-performance R&D teams. Managed and
    mentored teams of 20+ developers at ACS Technologies, overseeing hiring, roadmaps, and
    architectural standards across a multi-product SaaS portfolio. Track record of delivering
    flagship products at scale, pioneering mobile development, and driving organizational
    adoption of Git, CI/CD, and AI-augmented engineering workflows.

