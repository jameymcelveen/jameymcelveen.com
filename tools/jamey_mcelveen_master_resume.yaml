          Directed an R&D department of 20+ developers across hiring, mentorship,
          performance management, and multi-year product roadmaps.
        tags: [leadership, management, hiring, mentorship, roadmap, scale, christian-tech]
      - text: >
          Managed a multi-product SaaS portfolio spanning church management, mobile,
          school administration, and facility scheduling — coordinating priorities
          across independent engineering teams.
        tags: [leadership, product-management, saas, portfolio, christian-tech]

    # ACS products — include only the subset relevant to the role
    products:

      realm:
        name: Realm
        type: "Church management SaaS — C# .NET MVC, multi-tenant, 50,000+ orgs"
        bullets:
          - text: >
              Led the engineering of Realm, ACS Technologies' flagship C# .NET MVC
              platform serving 50,000+ churches with member management, giving,
              and community tools.
            tags: [dotnet, csharp, mvc, saas, multi-tenant, scale, christian-tech, architecture]
          - text: >
              Designed and maintained the multi-tenant data architecture supporting
              50,000+ isolated church environments, ensuring data integrity and
              performance at scale.
            tags: [architecture, multi-tenant, saas, scale, dotnet, database, christian-tech]
          - text: >
              Drove iterative modernization of the Realm codebase across multiple
              framework generations, balancing stability for existing customers with
              delivery of new capabilities.
            tags: [legacy-modernization, dotnet, saas, christian-tech, architecture]

      churchlife:
        name: ChurchLife (Mobile App)
        type: "Consumer iOS app — Objective-C / C# — App Store pioneer"
        bullets:
          - text: >
              Pioneered ChurchLife in 2008 — one of the first 100 apps on the Apple
