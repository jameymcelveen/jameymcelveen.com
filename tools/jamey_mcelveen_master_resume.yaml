        tags: [fullstack, scala, angular, react-native, mobile, fintech]
      - text: >
          Collaborated on technical design, code review, and iterative delivery
          within FinTech security, auditability, and compliance expectations.
        tags: [fintech, collaboration, security, compliance, process]

  - company: McLeod Health
    title: Senior Software Developer
    period: "Sept 2021 – July 2023"
    sector: healthcare
    bullets:
      - text: >
          Modernized legacy C# codebases to .NET Core standards for critical HR
          and healthcare infrastructure, improving maintainability and
          long-term compliance posture.
        tags: [dotnet, csharp, legacy-modernization, healthcare, hipaa, infrastructure]
      - text: >
          Introduced Git source control and CI/CD pipelines to the organization
          for the first time, establishing a repeatable, auditable release process.
        tags: [git, cicd, devops, healthcare, process-improvement, leadership]
      - text: >
          Mentored interns using Agile methodologies, ensuring seamless team
