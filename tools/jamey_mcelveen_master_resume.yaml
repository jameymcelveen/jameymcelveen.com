              iOS development tooling had matured.
            tags: [mobile, ios, objective-c, pioneer, christian-tech, app-store, innovation]
          - text: >
              Led mobile architecture and team for a consumer-facing church app,
              bridging C# backend services with an Objective-C native client.
            tags: [mobile, ios, architecture, christian-tech, leadership, fullstack]

      facility_scheduler:
