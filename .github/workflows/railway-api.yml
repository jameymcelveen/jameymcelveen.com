# Deploy the .NET Interview API to Railway when backend changes land on main.
#
# Setup (one-time):
#   1. Railway → your project → the API service → Settings → generate a Project token
#      (scoped to Production, or the environment you use for api.jameymcelveen.com).
#   2. GitHub → repo → Settings → Secrets and variables → Actions → New repository secret:
#        RAILWAY_TOKEN = <paste project token>
#   3. If the project has more than one service, add:
#        RAILWAY_SERVICE_NAME = <exact service name from Railway dashboard>
#
# Alternative: Railway dashboard → service → Connect Repo → deploy on push (no workflow).
# Use this workflow if you prefer deploys driven by GitHub Actions only.

name: Deploy API (Railway)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/railway-api.yml'

concurrency:
  group: railway-api-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Railway CLI
        run: npm i -g @railway/cli

      - name: railway up (backend / monorepo root)
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_SERVICE_NAME: ${{ secrets.RAILWAY_SERVICE_NAME }}
        run: |
          set -euo pipefail
          if [ -z "${RAILWAY_TOKEN}" ]; then
            echo "::error::Add repository secret RAILWAY_TOKEN (Railway project token). See workflow file comment at top."
            exit 1
          fi
          if [ -n "${RAILWAY_SERVICE_NAME}" ]; then
            railway up --service "${RAILWAY_SERVICE_NAME}" --ci --path-as-root ./backend
          else
            railway up --ci --path-as-root ./backend
          fi
