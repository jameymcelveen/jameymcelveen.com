# Local stack: .NET interview API + Next.js dev server.
#
# 1. Copy .env.example to .env and set GEMINI_API_KEY (Google AI Studio).
# 2. docker compose up --build
# 3. Open http://localhost:3000/ai (unlisted route; type URL manually)
#
# API only (use npm run dev on the host): docker compose up --build api

services:
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - '8080:8080'
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      PORT: '8080'
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      # Leave unset in .env to use SDK default (Gemini 2.0 Flash). Set GEMINI_MODEL only if overriding.
      GEMINI_MODEL: ${GEMINI_MODEL:-}
      STATS_API_KEY: ${STATS_API_KEY:-dev-stats-change-me}
      ConnectionStrings__DefaultConnection: Data Source=/app/data/analytics.db
    volumes:
      - api_data:/app/data
    restart: unless-stopped

  web:
    image: node:22-bookworm-slim
    working_dir: /app
    volumes:
      - .:/app
      - web_node_modules:/app/node_modules
    ports:
      - '3000:3000'
    environment:
      # Same-origin `/api/*` rewrites to the api service (see next.config.ts).
      INTERVIEW_API_PROXY_ORIGIN: http://api:8080
      STATS_API_KEY: ${STATS_API_KEY:-dev-stats-change-me}
      WATCHPACK_POLLING: 'true'
      CHOKIDAR_USEPOLLING: 'true'
    depends_on:
      - api
    command: >-
      sh -c "corepack enable && corepack prepare pnpm@10.33.0 --activate && pnpm install && pnpm dev -- --hostname 0.0.0.0 --port 3000"

volumes:
  api_data:
  web_node_modules:
