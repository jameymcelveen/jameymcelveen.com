<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Crew Roster</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Public+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#FCFAF5; --ink:#2E2A26; --rust:#B94700; --hair:#D9D3CA;
    --muted:#6B635A; --card:#FFFFFF;
  }
  @media (prefers-color-scheme: dark){
    :root{ --paper:#1A1815; --ink:#EDE8E0; --rust:#E8703A; --hair:#3A352F;
           --muted:#9A9188; --card:#232019; }
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--paper);color:var(--ink);
       font:16px/1.5 "Public Sans",system-ui,-apple-system,sans-serif;
       padding:24px 16px 64px}
  .wrap{max-width:900px;margin:0 auto}
  h1{font-family:"Bricolage Grotesque",system-ui,sans-serif;font-weight:800;
     font-size:clamp(28px,6vw,42px);margin:0 0 4px;letter-spacing:-.02em}
  .sub{color:var(--muted);font-size:14px;margin:0 0 28px}
  .sub code{background:var(--hair);padding:1px 5px;border-radius:3px;font-size:12px}
  h2{font-family:"Bricolage Grotesque",system-ui,sans-serif;font-weight:600;
     font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--rust);
     margin:34px 0 12px;padding-bottom:7px;border-bottom:1px solid var(--hair)}
  .row{display:flex;gap:14px;align-items:flex-start;background:var(--card);
       border:1px solid var(--hair);border-radius:8px;padding:14px 16px;margin-bottom:10px}
  .emoji{font-size:26px;line-height:1.1;flex:0 0 auto}
  .body{flex:1;min-width:0}
  .nameline{display:flex;flex-wrap:wrap;gap:8px;align-items:baseline}
  .name{font-family:"Bricolage Grotesque",system-ui,sans-serif;
        font-weight:600;font-size:19px}
  .desc{color:var(--muted);font-size:14px;margin-top:3px}
  .tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}
  .tag{font-size:11px;letter-spacing:.05em;text-transform:uppercase;
       border:1px solid var(--hair);border-radius:99px;padding:2px 9px;color:var(--muted)}
  .tag.eng{border-color:var(--rust);color:var(--rust)}
  .tag.ami{background:var(--hair);color:var(--ink);border-color:var(--hair)}
  .tag.warn{border-color:var(--rust);color:var(--rust);font-weight:600}
  .note{font-size:13px;color:var(--rust);margin-top:8px}
  .contact{font-size:12px;color:var(--muted);text-align:right;flex:0 0 auto;
           white-space:nowrap;padding-top:4px}
  .contact b{display:block;font-size:14px;color:var(--ink);font-weight:600}
  .req{border-left:3px solid var(--rust);padding:10px 14px;background:var(--card);
       border-radius:0 6px 6px 0;margin-bottom:10px;font-size:14px}
  footer{margin-top:40px;padding-top:14px;border-top:1px solid var(--hair);
         font-size:12px;color:var(--muted)}
  @media (max-width:560px){ .row{flex-wrap:wrap} .contact{text-align:left;padding-top:0} }
</style>
</head>
<body>
<div class="wrap">
  <h1>Crew Roster</h1>
  <p class="sub">Live from <code>/bobiverse/bobs.json</code>. Mastered in the gray-matter space,
     owned by Casey (RR). This page holds no data of its own.</p>
  <div id="out">Loading...</div>
  <footer id="foot"></footer>
</div>
<script>
(function(){
  var out=document.getElementById('out'), foot=document.getElementById('foot');
  function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
  function days(d){ if(!d) return null;
    return Math.floor((Date.now()-new Date(d+'T00:00:00'))/864e5); }

  fetch('./bobs.json',{cache:'no-cache'}).then(function(r){
    if(!r.ok) throw new Error('HTTP '+r.status); return r.json();
  }).then(function(d){
    var html='', bySys={};
    d.crew.forEach(function(c){ (bySys[c.system||'Unposted']=bySys[c.system||'Unposted']||[]).push(c); });

    Object.keys(bySys).sort().forEach(function(sys){
      html+='<h2>'+esc(sys)+'</h2>';
      bySys[sys].sort(function(a,b){return a.name.localeCompare(b.name);}).forEach(function(c){
        var age=days(c.last_contact);
        html+='<div class="row"><div class="emoji">'+esc(c.emoji)+'</div><div class="body">'
          +'<div class="nameline"><span class="name">'+esc(c.name)+'</span></div>'
          +'<div class="desc">'+esc(c.description)+'</div><div class="tags">'
          +'<span class="tag'+(c.type==='ami'?' ami':'')+'">'+esc(c.type)+'</span>'
          +(c.engine?'<span class="tag eng">'+esc(c.engine)+'</span>':'')
          +(c.status!=='active'?'<span class="tag warn">'+esc(c.status)+'</span>':'')
          +(c.brain?'<span class="tag">'+esc(c.brain)+'</span>':'')
          +'</div>'+(c.notes?'<div class="note">'+esc(c.notes)+'</div>':'')
          +'</div><div class="contact"><b>'+esc(c.last_contact||'never')+'</b>'
          +(age===null?'no contact yet':(age===0?'today':age===1?'yesterday':age+' days ago'))+'</div></div>';
      });
    });

    if(d.open_reqs && d.open_reqs.length){
      html+='<h2>Open reqs</h2>';
      d.open_reqs.forEach(function(r){
        html+='<div class="req"><b>'+esc(r.role)+'</b> at '+esc(r.system)
          +'<div class="desc">'+esc(r.note)+'</div></div>';
      });
    }
    if(d.not_crew && d.not_crew.names){
      html+='<h2>Not crew</h2><div class="req">'
        +esc(d.not_crew.names.join(', '))
        +'<div class="desc">Names that turn up in fleet files but are not members. '
        +'No brain folder, no history. Do not invent one.</div></div>';
    }
    out.innerHTML=html;
    foot.textContent='Roster updated '+d.updated+'. '+d.crew.length
      +' members. Edit the master, then run roster.py sync. Never edit this copy.';
  }).catch(function(e){
    out.innerHTML='<div class="req"><b>Could not load bobs.json</b>'
      +'<div class="desc">'+esc(e.message)+'</div></div>';
  });
})();
</script>
</body>
</html>
